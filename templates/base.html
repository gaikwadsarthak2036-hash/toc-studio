<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}TOC Studio{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body>

<header class="site-nav">
  <a class="brand" href="{{ url_for('index') }}">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26">
        <circle cx="9" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="23" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="15" y1="16" x2="17" y2="16" stroke="currentColor" stroke-width="2"/>
      </svg>
    </span>
    <span class="brand-text">TOC<em>Studio</em></span>
  </a>

  <nav class="nav-links" aria-label="Primary">
    <a href="{{ url_for('index') }}#modules">Modules</a>
    <a href="{{ url_for('index') }}#how-it-works">How it works</a>
    <a href="{{ url_for('index') }}#about">About</a>
    <a href="{{ url_for('index') }}#help">Help</a>
  </nav>

  <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>TOC Studio &mdash; built for DSCAT lab work and self-learning.</span>
    <span class="footer-modules">Sets &middot; Relations &middot; DFA &middot; NFA &middot; &#949;-NFA &middot; Regex &middot; CFG &middot; PDA &middot; Turing Machine</span>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
